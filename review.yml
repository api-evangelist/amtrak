  reason: >-
    No OpenAPI, AsyncAPI, GraphQL schema or Postman collection exists anywhere
    on Amtrak's estate or in the APIs.guru directory, so the openapi/ directory
    is deliberately absent rather than empty. One real machine-readable
    contract was found and harvested verbatim - the GTFS schedule feed - and it
    is the single entry in apis.yml. The live undocumented surfaces
    (maps.amtrak.com MapDataService and RoutesList.json, api.amtrak.com) are
    recorded in observedButUndocumented and excluded from apis.yml, because
    none has a published contract, licence or terms of use, and the two
    MapDataService endpoints return encrypted payloads that Amtrak has
    deliberately obfuscated.
