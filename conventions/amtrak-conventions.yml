scope: >-
  These conventions describe the ONE contract Amtrak publishes - a static GTFS
  archive fetched over HTTPS. Amtrak documents none of them; every value below
  was observed on the wire or read out of the harvested feed. There is no
  first-party page describing the feed, so nothing here is a provider promise.
