description: >-
  Amtrak (the National Railroad Passenger Corporation) is the federally chartered
  operator of the United States national intercity passenger rail network,
  headquartered in Washington, D.C. It runs the Northeast Corridor including
  Acela, the state-supported corridors, the long-distance network, and the
  Amtrak Thruway Connecting Service bus network, and its published GTFS feed
  covers 61 routes, 646 stops, 2,948 trips and 20 operating agencies across the
  United States and into Canada. In the distribution chain Amtrak sits as a
  GDS-intermediated supplier of its own inventory: its content reaches
  third-party booking tools through Travelport Universal API, through Sabre,
  Apollo and Worldspan on the RailAgent channel, and through rail aggregators
  including SilverRail, Travelfusion and RailKey Technologies, alongside its own
  amtrak.com, mobile app and call centre. Its API posture is honestly stated as
  one open-standard data feed and nothing else. The only machine-readable
  contract Amtrak publishes is a static GTFS schedule archive at
  content.amtrak.com, which is completely ungated - no key, no registration, no
  click-through - but which Amtrak advertises nowhere: there is no developer
  portal, no documentation page, no OpenAPI, no AsyncAPI, no GraphQL, and no
  published terms of use for the feed. Everything transactional is closed. The
  developer., docs., data. and partners. subdomains of amtrak.com do not
  resolve, developers.amtrak.com resolves only to a Microsoft Entra application
  proxy, api.amtrak.com answers 401 on every path from Akamai NetStorage, and
  www.amtrak.com returns 403 to every non-browser client, so no first-party
  terms of service could be retrieved programmatically. A developer who wants
  shopping, booking, payment, ticketing or servicing does not sign up; they are
  accredited through Travelport or an aggregator, complete an Amtrak test-case
  worksheet, pass a three-week UAT, and commit to supporting Amtrak refund fees
  and eVoucher issuance before production credentials are issued.
