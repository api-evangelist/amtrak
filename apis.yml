apis:
- aid: amtrak:amtrak-gtfs-schedule-feed
  name: Amtrak GTFS Schedule Feed
  description: >-
    Amtrak's complete national timetable published as a static General Transit
    Feed Specification archive, served from content.amtrak.com with no
    registration, no API key, no click-through licence and no rate limit. The
    edition harvested on 2026-07-28 carries feed_version 20260727 and holds 8
    GTFS files - agency, calendar, feed_info, routes, shapes, stops, stop_times
    and trips - covering 20 agencies, 61 routes (49 rail and 12 bus by
    route_type), 646 stops, 2,948 trips, 37,862 stop times and 373,236 shape
    points, with calendar service dates spanning 20260726 to 20270726. The named
    routes include Acela, the Auto Train, the California Zephyr, the Coast
    Starlight, the Empire Builder, the Crescent, the Cardinal, Amtrak Cascades,
    the Capitol Corridor, the Hartford Line, the Downeaster, the Borealis, the
    Berkshire Flyer and the Amtrak Thruway Connecting Service, and stop_id is
    the familiar Amtrak three-letter station code. feed_info declares
    feed_publisher_name Amtrak and a first-party contact address of
    DL_DTGTFSsupport@Amtrak.com. This is the only machine-readable contract
    Amtrak publishes, and Amtrak publishes no page describing it - the URL is
    discoverable only through third-party registries such as the Mobility
    Database and Transitland.
  humanURL: https://mobilitydatabase.org/feeds/gtfs/mdb-11
  baseURL: https://content.amtrak.com/content/gtfs/GTFS.zip
