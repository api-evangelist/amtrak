summary: >-
  Amtrak ships no client library in any language. Every package below is
  community-built and unaffiliated - none is published by the National Railroad
  Passenger Corporation, none is listed on an Amtrak page, and none is
  supported by Amtrak. They are recorded because they are the de facto
  integration surface for Amtrak data, and because most of them do not consume
  the one contract Amtrak publishes: they scrape amtrak.com or decrypt the
  undocumented maps.amtrak.com Track Your Train payload. No SDKs pointer is
  emitted in apis.yml, because Amtrak has no SDK.
